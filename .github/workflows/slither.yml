name: Slither Analysis

on:
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - synchronize
      - edited

jobs:
  analyze-core:
    if: ${{ !contains(github.event.pull_request.title, 'WIP') }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e # v1.5.0
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Run Slither
        uses: crytic/slither-action@6ef3a33e56de4e8f59488cf60858b5c1bf4967c0 # v0.3.0
        id: slither
        with:
          target: '.'
          slither-config: 'slither.config.json'
          node-version: 16
          fail-on: none
          slither-args: --checklist

      - name: Create/update checklist as PR comment
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        env:
          SLITHER_REPORT: ${{ steps.slither.outputs.stdout }}
        if: github.event_name == 'pull_request'
        with:
          script: |
            const script = require('.github/scripts/push_comment_to_pr.js');
            const header = '# Slither report';
            const body = process.env.SLITHER_REPORT;
            const comment = [header, body].join('\n');
            await script({ github, context, header, body });
